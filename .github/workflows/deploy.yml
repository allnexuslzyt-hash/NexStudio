name: Despliegue Automático a Cloudflare

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Compilar y Desplegar
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar aplicación (Vite)
        run: npm run build

      - name: Desplegar a Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "❌ ERROR: Falta el secreto CLOUDFLARE_API_TOKEN en tu repositorio de GitHub."
            echo "👉 Ve a Settings > Secrets and variables > Actions y agrega CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          npx wrangler deploy
